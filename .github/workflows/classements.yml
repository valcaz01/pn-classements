# PN — met à jour classement.json et son cumul hebdomadaire toutes les 15 minutes,
# et poste les alertes de passage de grade (Cadet, Policier adjoint) dans le salon Discord « Alertes-promotions ».
# Dépôt PUBLIC pn-classements (voir LISEZMOI.md).
# Secrets du dépôt (Settings → Secrets and variables → Actions) : WIRED_READ_KEY (clé de LECTURE de l'add-on API Web),
# DISCORD_WEBHOOK (webhook du salon « Alertes-promotions »).
# Variable du dépôt (même écran, onglet Variables) : VAR_PR = pts_recrutement_total.
# Suivi : un formateur réagit ✅ sous une alerte une fois le badge accordé ; le passage suivant la passe en vert.
# Minutes décalées (7, 22, 37, 52) : GitHub saute beaucoup de passages programmés pile à :00/:15/:30/:45.
# Données lues par le forum : https://raw.githubusercontent.com/valcaz01/pn-classements/main/classement.json
name: classements
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Message de test dans le salon Discord"
        type: choice
        options: [aucun, connexion, suivi]
        default: aucun
permissions:
  contents: write
concurrency: classements
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lire l'API Web Habbo
        env:
          WIRED_ROOM_ID: "46858918"  # salle « Test » (porte xp et l'add-on API Web)
          WIRED_READ_KEY: ${{ secrets.WIRED_READ_KEY }}
          VAR_XP: xp
          VAR_PR: ${{ vars.VAR_PR }}
        run: python build_classement.py
      - name: Alertes de passage de grade (Discord)
        continue-on-error: true
        env:
          WIRED_ROOM_ID: "46858918"
          WIRED_READ_KEY: ${{ secrets.WIRED_READ_KEY }}
          VAR_PR: ${{ vars.VAR_PR }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TEST: ${{ inputs.test == 'connexion' && '1' || inputs.test == 'suivi' && 'suivi' || '' }}
        run: python alertes_grade.py
      - name: Publier si changement
        run: |
          git config user.name "pn-classements"
          git config user.email "actions@users.noreply.github.com"
          git add classement.json noms.json classement-state.json
          if [ -f etat_grades.json ]; then git add etat_grades.json; fi
          git diff --cached --quiet || git commit -m "Classements $(date -u +%FT%TZ)"
          git push
